const MO={kr:["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"],lt:["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"],ru:["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"]};
function render(){
 const t=T[L];document.documentElement.lang=L==="ru"?"ru":"uz";
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
 document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t[e.dataset.ph]);
 document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
 $("#hello").textContent=hello()+"!";const d=new Date();$("#today").textContent=`${WD[L][d.getDay()]}, ${d.getDate()} ${MO[L][d.getMonth()]} · ${L==="ru"?"Ходжаабад":L==="lt"?"Xo'jaobod":"Хўжаобод"}`;
 $("#grid").innerHTML=SEC.map(s=>`<button class="tile" data-sec="${s.id}"><span class="ic" style="background:${s.c}">${s.ic}</span><b>${s.n[L]}</b></button>`).join("");
 $("#partners").innerHTML=PART.map((p,i)=>`<a class="row" data-part="${i}"><span class="ic">${p.ic}</span><div><b>${p.n}</b><span>${p.s[L]}</span></div><span class="go">›</span></a>`).join("");
 $("#useful").innerHTML=[["🕌",t.pr,t.prs,"bot:prayer"],["📢",t.ch,t.chs,"https://t.me/"+CH],["🕊️",t.xot,t.xots,"https://t.me/XOTIRAXOJAOBOD"],["☎️",t.contact,t.contacts,"https://t.me/Ozodjamol"]]
  .map(r=>`<a class="row" data-u="${r[3]}"><span class="ic">${r[0]}</span><div><b>${r[1]}</b><span>${r[2]}</span></div><span class="go">›</span></a>`).join("");
 wxRender();
}
function sheet(s){const t=T[L];
 $("#box").innerHTML=`<div class="grab"></div><div class="sh"><span class="ic" style="background:${s.c}">${s.ic}</span><div><b>${s.n[L]}</b><span>${T[L].brand}</span></div></div>
 <div class="tags">${s.sub[L].map(x=>`<span class="tag">${x}</span>`).join("")}</div>
 <div class="soon">⏳ ${t.soon}</div>
 ${s.id==="auto"?`<a class="wide" data-bot="taxi">🚕 ${t.taxi}</a>`:""}
 ${s.link?`<a class="wide alt" data-u="${s.link}">${s.id==="xot"?"🕊 Хотира":t.open}</a>`:""}
 <a class="wide ${s.id==="auto"?"alt":""}" data-bot="ad">${t.post}</a>
 <a class="wide alt" data-bot="${s.start}">${t.open}</a>`;
 $("#sheet").classList.add("on");if(tg&&tg.BackButton){tg.BackButton.show()}}
function closeSheet(){$("#sheet").classList.remove("on");if(tg&&tg.BackButton)tg.BackButton.hide()}
document.addEventListener("click",e=>{
 const l=e.target.closest("[data-l]");if(l){L=l.dataset.l;localStorageSet("xc24_lang",L);render();return}
 const g=e.target.closest("[data-go]");if(g){openBot(g.dataset.go);return}
 const sc=e.target.closest("[data-sec]");if(sc){const s=SEC.find(x=>x.id===sc.dataset.sec);haptic();if(s.direct){s.link?openLink(s.link):openBot(s.start)}else sheet(s);return}
 const b=e.target.closest("[data-bot]");if(b){openBot(b.dataset.bot);return}
 const u=e.target.closest("[data-u]");if(u){const v=u.dataset.u;v.startsWith("bot:")?openBot(v.slice(4)):openLink(v);return}
 const p=e.target.closest("[data-part]");if(p){openLink(PART[+p.dataset.part].url);return}
 if(e.target.closest("[data-close]"))closeSheet();
});
$("#adslot").addEventListener("click",()=>openLink("https://t.me/Ozodjamol"));
// поиск по разделам и подразделам
$("#q").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();if(q.length<2){render();return}
 const hits=SEC.filter(s=>(s.n[L]+" "+(s.sub?s.sub[L].join(" "):"")).toLowerCase().includes(q));
 $("#grid").innerHTML=hits.length?hits.map(s=>`<button class="tile" data-sec="${s.id}"><span class="ic" style="background:${s.c}">${s.ic}</span><b>${s.n[L]}</b></button>`).join(""):`<p style="grid-column:1/-1;color:var(--muted);font-size:14px;padding:6px 2px">${T[L].nores}</p>`});
// погода и воздух (open-meteo, без ключа)
let WX=null;
function kind(c){c=+c;if(c<=1)return"clear";if(c==2)return"partly";if(c==3)return"cloudy";if(c==45||c==48)return"fog";if([71,73,75,77,85,86].includes(c))return"snow";if((c>=51&&c<=67)||(c>=80&&c<=82)||c>=95)return"rain";return"partly"}
const IC={clear:"☀️",partly:"⛅",cloudy:"☁️",fog:"🌫",rain:"🌧",snow:"❄️"};
function wxRender(){if(!WX)return;const t=T[L],s=v=>(v>0?"+":"")+v+"°";
 $("#wnow").textContent=`${IC[WX.k]} ${s(WX.t)}`;$("#wsky").textContent=t.sky[WX.k];
 $("#wtmr").textContent=`${IC[WX.tk]} ${s(WX.tmax)}`;$("#wtsky").textContent=t.sky[WX.tk];
 if(WX.aq!=null){$("#aq").textContent=WX.aq;$("#aqt").textContent=t.aqw[WX.aq<=50?0:WX.aq<=100?1:2]}}
fetch("https://api.open-meteo.com/v1/forecast?latitude=40.671&longitude=72.565&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max&timezone=Asia%2FTashkent&forecast_days=2")
 .then(r=>r.json()).then(f=>{WX={t:Math.round(f.current.temperature_2m),k:kind(f.current.weather_code),tmax:Math.round(f.daily.temperature_2m_max[1]),tk:kind(f.daily.weather_code[1]),aq:null};wxRender();
  return fetch("https://air-quality-api.open-meteo.com/v1/air-quality?latitude=40.671&longitude=72.565&current=us_aqi")}).then(r=>r&&r.json()).then(a=>{if(a&&WX){WX.aq=Math.round(a.current.us_aqi);wxRender()}}).catch(()=>{});
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor("#0e7a5f");tg.setBackgroundColor("#f3f6f2");tg.BackButton.onClick(closeSheet);
 if(tg.MainButton){tg.MainButton.setParams({text:"🚕 "+T[L].taxi,color:"#f2b13a",text_color:"#3a2604"});}}catch(e){}}
render();
</script>
</body>
</html>

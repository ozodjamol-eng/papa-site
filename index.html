  .row{display:flex;align-items:center;gap:13px;padding:12px 16px;position:relative}
  .row+.row:before{content:"";position:absolute;top:0;right:0;left:61px;height:.5px;background:var(--sep)}
  .ico{width:32px;height:32px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff}
  .ico svg{width:19px;height:19px;fill:currentColor}

<head>

<style>
  :root{--brand:#ff5a1f;--brand2:#ff7a2f;--bg:#fff6ee;--soft:#ffeedd;--card:#fff;--text:#1d1714;--muted:#6f625a;--line:#f5e3d3;--tg:#2aabee}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  .hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--brand2),var(--brand));color:#fff;
        padding:22px 16px 74px;border-radius:0 0 34px 34px;text-align:center}
  .hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
  .hero:before{width:300px;height:300px;right:-120px;top:-110px}
  .hero:after{width:220px;height:220px;left:-110px;bottom:-120px}
  .lang{position:absolute;right:14px;top:14px;display:flex;background:rgba(255,255,255,.22);border-radius:99px;padding:3px;z-index:2}
  .lang button{border:0;background:transparent;color:#fff;font-weight:700;font-size:13px;padding:6px 12px;border-radius:99px;cursor:pointer}
  .lang button.on{background:#fff;color:var(--brand)}
  .ava{position:relative;z-index:1;width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;
       box-shadow:0 8px 24px rgba(120,30,0,.25);margin:26px auto 10px;display:block;background:#fff}
  .hero h1{position:relative;z-index:1;font-size:34px;font-weight:800;letter-spacing:.5px}
  .hero p{position:relative;z-index:1;font-size:16px;opacity:.95;max-width:340px;margin:4px auto 0}
  main{max-width:480px;margin:-50px auto 0;padding:0 16px calc(28px + env(safe-area-inset-bottom));position:relative;z-index:3}
  .tabs{display:flex;background:#fff;border-radius:22px;padding:6px;box-shadow:0 10px 30px rgba(255,90,31,.12);margin-bottom:16px}
  .tabs button{flex:1;border:0;background:transparent;font-weight:700;font-size:16px;padding:13px;border-radius:17px;color:var(--text);cursor:pointer}
  .tabs button.on{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(255,90,31,.35)}
  .both{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--text);color:#fff;
        font-weight:800;font-size:17px;padding:17px;border-radius:20px;margin-bottom:6px}
  .hint{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:14px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .head h2{font-size:21px;line-height:1.2}
  .pill{flex:none;font-size:13px;font-weight:700;color:var(--brand);background:var(--soft);border-radius:99px;padding:6px 12px}
  .cava{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;background:var(--soft);font-size:22px}
  .who{display:flex;gap:12px;align-items:center}
  .desc{background:var(--soft);border-radius:16px;padding:12px 14px;margin:14px 0;color:var(--text);font-size:15px}
  .btns{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
  .b1,.b2{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 10px;border-radius:18px;font-weight:800;font-size:16px;border:0;cursor:pointer;font-family:inherit}
  .b1{background:var(--brand);color:#fff}
  .b2{background:var(--soft);color:var(--text)}
  .b1 svg,.b2 svg{width:20px;height:20px;fill:currentColor;flex:none}
  .b1:active,.b2:active,.both:active{transform:scale(.98)}
  .adcard{border:1.5px solid var(--brand)}
  .adcard ul{list-style:none;margin:12px 0 14px;display:grid;gap:8px}
  .adcard li{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:15px}
  h3{text-align:center;font-size:19px;margin:22px 0 12px}
  .social{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
  .social a{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 4px;text-align:center;font-size:13px;font-weight:600}
  .social i{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 6px;border-radius:14px;background:var(--soft);color:var(--brand)}
  .social svg{width:24px;height:24px;fill:currentColor}
  [hidden]{display:none!important}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:22px;line-height:1.9}
  footer b{color:var(--brand)}
</style>
</head>
<body>
<section class="hero">

      </div>
    </section>
  </div>

  <div id="ad" hidden>
    <section class="card adcard">
      <div class="head"><h2 data-t="ad_t"></h2><span class="pill">📩</span></div>
      <ul>
        <li data-t="ad_1"></li><li data-t="ad_2"></li><li data-t="ad_3"></li>

      <a class="b1" id="ads" href="https://www.instagram.com/paparazzi.uz/"><span data-t="ad_b"></span></a>

  var lang="cyr"; try{lang=localStorage.getItem("papa_lang")||"cyr"}catch(e){}

    document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=T[lang][e.getAttribute("data-t")]||""});
